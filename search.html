<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — Agave</title>
<link rel="stylesheet" href="agave.css">
<script src="chrome.js" defer></script>
</head>
<body data-screen-label="Search Results">

  <div data-agave-header data-nav=""></div>

  <nav class="crumbs" aria-label="Breadcrumb">
    <div class="container breadcrumb">
      <a href="index.html">Home</a><span class="sep">/</span>
      <span aria-current="page">Search</span>
    </div>
  </nav>

  <main>
    <section class="section">
      <div class="container search-page">

        <header class="search-head">
          <h1>Search</h1>
          <form class="search-form" id="searchForm" role="search">
            <div class="search search--lg">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
              <input type="search" id="q" value="plone" placeholder="Search the site…" aria-label="Search terms">
            </div>
            <button class="btn btn--primary" type="submit">Search</button>
          </form>
        </header>

        <div class="results-bar">
          <p class="results-count" id="count" aria-live="polite"></p>
          <div class="sort-control">
            <label for="sort">Sort by</label>
            <span class="sort-select">
              <select id="sort">
                <option value="relevance">Relevance</option>
                <option value="date">Date (newest)</option>
                <option value="alpha">Alphabetical</option>
              </select>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
          </div>
        </div>

        <div class="results" id="results"></div>

        <nav class="pagination" id="pagination" aria-label="Search results pages"></nav>

      </div>
    </section>
  </main>

  <div data-agave-footer></div>

  <script>
  (function () {
    const TYPE_LABEL = { news: "News", event: "Event", page: "Page" };
    const HREF = { news: "news.html", event: "event.html", page: "page.html" };
    const CRUMB_HREF = { "Home": "index.html", "News": "news.html", "Events": "event.html", "About": "page.html" };

    // Sample search corpus (in a real Plone site this comes from the catalog).
    const DATA = [
      { type:"news",  date:"2026-03-20", title:"Agave reaches 1,000 downloads", summary:"The Plone theme passes a milestone in its first month, with adoption across cultural and community sites.", crumbs:["Home","News","Agave reaches 1,000 downloads"] },
      { type:"news",  date:"2026-03-18", title:"New documentation site launches", summary:"Comprehensive guides for Plone editors and site builders, written to be followed start to finish.", crumbs:["Home","News","New documentation site launches"] },
      { type:"news",  date:"2026-03-12", title:"A new theme called Agave debuts at Plone Conference", summary:"Unveiled to a packed room in Mexico City, the lightweight Plone theme is already turning heads.", crumbs:["Home","News","Agave debuts at Plone Conference"], href:"news.html" },
      { type:"news",  date:"2026-02-28", title:"Call for translators: help bring Agave to ten languages", summary:"The localisation effort for the Plone theme kicks off this spring, starting with Spanish, Portuguese and German.", crumbs:["Home","News","Call for translators"] },
      { type:"news",  date:"2026-02-19", title:"Accessibility audit gives the default templates top marks", summary:"An independent review found the Plone theme meets WCAG 2.2 AA out of the box.", crumbs:["Home","News","Accessibility audit"] },
      { type:"news",  date:"2026-02-05", title:"Roadmap: what's coming after the first Agave release", summary:"Homepage layouts, collection views and a dark mode are all on the table for the Plone theme.", crumbs:["Home","News","Roadmap"] },
      { type:"news",  date:"2026-01-22", title:"Plone 6 powers the new foundation website", summary:"Our relaunch runs entirely on Plone with the Agave theme on top — here's what we learned.", crumbs:["Home","News","Plone 6 powers the new website"] },
      { type:"news",  date:"2026-01-14", title:"Community spotlight: building with Plone in Oaxaca", summary:"How a small regional museum publishes its archive and exhibitions on Plone.", crumbs:["Home","News","Community spotlight: Oaxaca"] },
      { type:"news",  date:"2026-01-06", title:"Meet the Agave working group", summary:"The small team of developers, designers and educators building the next Plone theme.", crumbs:["Home","News","Meet the Agave working group"] },
      { type:"news",  date:"2026-01-03", title:"Sprint report: accessibility and internationalisation", summary:"Highlights from the latest Plone Agave sprint, where the focus was a11y and i18n.", crumbs:["Home","News","Sprint report"] },

      { type:"event", date:"2026-04-18", title:"Hands-on Agave Theming Workshop", summary:"A half-day, practical session on taking the Agave theme for Plone and making it entirely your own.", crumbs:["Home","Events","Hands-on Agave Theming Workshop"], href:"event.html" },
      { type:"event", date:"2026-05-02", title:"Plone Beginners' Meetup", summary:"An informal evening for anyone new to the Plone community. Drinks and snacks provided.", crumbs:["Home","Events","Plone Beginners' Meetup"] },
      { type:"event", date:"2026-05-16", title:"Accessibility Clinic: audit your site live", summary:"Bring a Plone URL and leave with a prioritised, practical list of accessibility fixes.", crumbs:["Home","Events","Accessibility Clinic"] },
      { type:"event", date:"2026-05-30", title:"Content Editors' Roundtable", summary:"Share Plone editing workflows and tips with editors from other organisations.", crumbs:["Home","Events","Content Editors' Roundtable"] },
      { type:"event", date:"2026-06-09", title:"Intro to Plone Theming (online webinar)", summary:"A live, beginner-friendly webinar covering the basics of theming Plone with Agave.", crumbs:["Home","Events","Intro to Plone Theming"] },
      { type:"event", date:"2026-06-12", title:"Plone Foundation AGM", summary:"The annual general meeting of the Plone Foundation, open to all members.", crumbs:["Home","Events","Plone Foundation AGM"] },

      { type:"page",  date:"2026-02-02", title:"About the Foundation", summary:"We support open, accessible publishing with Plone for cultural and community organisations.", crumbs:["Home","About","About the Foundation"], href:"page.html" },
      { type:"page",  date:"2026-01-15", title:"Installing Plone with the Agave theme", summary:"A step-by-step guide to adding the Agave theme to a fresh Plone 6 site.", crumbs:["Home","About","Documentation","Installing Plone with Agave"] },
      { type:"page",  date:"2026-01-10", title:"Customising the colour palette", summary:"Re-skin the whole Plone theme by editing a handful of CSS variables — no rebuild required.", crumbs:["Home","About","Documentation","Customising the colour palette"] },
      { type:"page",  date:"2026-01-08", title:"Content editing basics", summary:"How to create and manage News Items, Events and Pages in Plone.", crumbs:["Home","About","Documentation","Content editing basics"] },
      { type:"page",  date:"2026-01-05", title:"Theme architecture overview", summary:"Understand how the Agave theme is structured within Plone and where to extend it.", crumbs:["Home","About","Documentation","Theme architecture overview"] },
      { type:"page",  date:"2026-01-01", title:"Frequently asked questions", summary:"Answers to common questions about Plone and the Agave theme.", crumbs:["Home","About","Frequently asked questions"] },
      { type:"page",  date:"2025-12-28", title:"Contributing to Agave", summary:"How to report issues and submit improvements to the Plone theme.", crumbs:["Home","About","Contributing to Agave"] },
      { type:"page",  date:"2025-12-20", title:"Privacy policy", summary:"How we handle personal data on our Plone-powered website.", crumbs:["Home","Legal","Privacy policy"] },
    ];

    const PER_PAGE = 10;
    const params = new URLSearchParams(location.search);
    let state = { q: params.has("q") ? params.get("q") : "plone", sort: "relevance", page: 1 };

    const $ = (id) => document.getElementById(id);
    const esc = (s) => s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
    const fmtDate = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { day:"numeric", month:"long", year:"numeric" });

    function highlight(text, q) {
      const safe = esc(text);
      if (!q) return safe;
      const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
      return safe.replace(re, "<mark>$1</mark>");
    }

    function filtered() {
      const q = state.q.trim().toLowerCase();
      let items = DATA.filter(d =>
        !q || d.title.toLowerCase().includes(q) || d.summary.toLowerCase().includes(q));
      if (state.sort === "date") items = items.slice().sort((a, b) => b.date.localeCompare(a.date));
      else if (state.sort === "alpha") items = items.slice().sort((a, b) => a.title.localeCompare(b.title));
      // "relevance" keeps source order (already roughly score-ranked)
      return items;
    }

    function renderCrumb(crumbs) {
      return crumbs.map((c, i) => {
        const last = i === crumbs.length - 1;
        const sep = i > 0 ? '<span class="sep">/</span>' : "";
        if (last) return sep + `<span aria-current="page">${esc(c)}</span>`;
        const href = CRUMB_HREF[c] || "#";
        return sep + `<a href="${href}">${esc(c)}</a>`;
      }).join("");
    }

    function renderResults() {
      const all = filtered();
      const total = all.length;
      const pages = Math.max(1, Math.ceil(total / PER_PAGE));
      if (state.page > pages) state.page = pages;
      const start = (state.page - 1) * PER_PAGE;
      const slice = all.slice(start, start + PER_PAGE);

      // count line
      const qLabel = state.q.trim();
      $("count").innerHTML = total === 0
        ? `No results${qLabel ? ` for <em>“${esc(qLabel)}”</em>` : ""}`
        : `<b>${total}</b> result${total === 1 ? "" : "s"}${qLabel ? ` for <em>“${esc(qLabel)}”</em>` : ""}` +
          (total > PER_PAGE ? ` &middot; showing ${start + 1}–${start + slice.length}` : "");

      // results
      const box = $("results");
      if (total === 0) {
        box.innerHTML = `<div class="no-results"><b>Nothing found</b>Try a different term or check your spelling.</div>`;
        $("pagination").innerHTML = "";
        return;
      }
      box.innerHTML = slice.map(d => {
        const href = d.href || HREF[d.type] || "#";
        return `<article class="result">
          <div class="result-meta">
            <span class="tag tag--${d.type}"><span class="dot"></span>${TYPE_LABEL[d.type]}</span>
            <time datetime="${d.date}">${fmtDate(d.date)}</time>
          </div>
          <h3><a href="${href}">${highlight(d.title, state.q.trim())}</a></h3>
          <p class="result-summary">${highlight(d.summary, state.q.trim())}</p>
          <nav class="breadcrumb result-crumb" aria-label="Location">${renderCrumb(d.crumbs)}</nav>
        </article>`;
      }).join("");

      renderPagination(pages);
    }

    function renderPagination(pages) {
      const pag = $("pagination");
      if (pages <= 1) { pag.innerHTML = ""; return; }
      const p = state.page;
      let html = `<button data-go="${p - 1}" ${p === 1 ? "disabled" : ""} aria-label="Previous page">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="15 6 9 12 15 18"/></svg>Prev</button>`;
      for (let i = 1; i <= pages; i++) {
        html += `<button data-go="${i}" ${i === p ? 'aria-current="page"' : ""}>${i}</button>`;
      }
      html += `<button data-go="${p + 1}" ${p === pages ? "disabled" : ""} aria-label="Next page">Next
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 6 15 12 9 18"/></svg></button>`;
      pag.innerHTML = html;
    }

    // events
    $("searchForm").addEventListener("submit", (e) => {
      e.preventDefault();
      state.q = $("q").value;
      state.page = 1;
      renderResults();
    });
    $("sort").addEventListener("change", (e) => { state.sort = e.target.value; state.page = 1; renderResults(); });
    $("pagination").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-go]");
      if (!btn || btn.disabled) return;
      state.page = Number(btn.dataset.go);
      renderResults();
      document.querySelector(".search-head").scrollIntoView ? window.scrollTo({ top: 0, behavior: "smooth" }) : null;
    });

    renderResults();
    $("q").value = state.q;
  })();
  </script>

  <div id="agave-tweaks"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="tweaks-app.jsx"></script>
</body>
</html>
